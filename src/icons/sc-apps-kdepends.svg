<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
	<!-- Elbow connectors from the module to each dependency gem -->
	<path d="M 22 18 H 27 M 27 12 V 36 M 27 12 H 32 M 27 36 H 32" fill="none" stroke="#4d4d4d" stroke-width="2"/>

	<!-- The module: a Plasma-blue square with a dark frame -->
	<rect x="2" y="8" width="20" height="20" rx="2" fill="#4d4d4d"/>
	<rect x="3" y="9" width="18" height="18" rx="1" fill="#3daee9"/>
	<rect x="3" y="9" width="18" height="9" rx="1" fill="#54b9ec"/>

	<!-- Dependency gem, turquoise: lit upper facet over a darker lower facet -->
	<g stroke="#4d4d4d" stroke-width="1.5" stroke-linejoin="round">
		<path d="M 30 12 L 38 4 L 46 12 Z" fill="#5ed5c0"/>
		<path d="M 30 12 L 46 12 L 38 20 Z" fill="#1abc9c"/>
	</g>

	<!-- Dependency gem, pink -->
	<g stroke="#4d4d4d" stroke-width="1.5" stroke-linejoin="round">
		<path d="M 30 36 L 38 28 L 46 36 Z" fill="#f07cc0"/>
		<path d="M 30 36 L 46 36 L 38 44 Z" fill="#e93a9a"/>
	</g>
</svg>
